# LOCAL PGADMIN CONNECTION
# Ensure the DB name at the end matches what you see in pgAdmin (e.g., postgres, library_db)
spring.datasource.url=jdbc:postgresql://localhost:5432/library_db

# Usually the username is 'postgres'
spring.datasource.username=postgres

# The password you use to open pgAdmin
spring.datasource.password=1234

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Settings (Create tables automatically)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true